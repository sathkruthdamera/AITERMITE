[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aitermite"
version = "0.5.0"
description = "AI terminal copilot: fixes failed commands and answers plain thoughts (claude/codex), with an arrow-key run menu"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AITERMITE"}]
keywords = ["cli", "terminal", "ai", "ollama", "openai", "shell", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Terminals"
]
dependencies = []

[project.scripts]
aitermite = "aitermite.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
